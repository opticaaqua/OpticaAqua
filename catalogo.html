<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Óptica Aqua</title>

    <!-- TIPOGRAFÍA POPPINS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- ESTILOS -->
    <link rel="stylesheet" href="style.css/style.css">

</head>

<button id="volver-arriba" class="volver-arriba" aria-label="Volver arriba">
    <span class="flecha-chunky"></span>
</button>

<body data-pagina="catálogo">


    <!-- =========================
         ENCABEZADO
         ========================= -->

    <header class="encabezado">

    <button class="menu-hamburguesa" id="abrir-menu" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="logo">
        <img src="imagenes/Aqua Logo.png" alt="Óptica Aqua">
    </div>

    <nav class="menu" id="menu-principal">

        <button class="cerrar-menu" id="cerrar-menu" aria-label="Cerrar menú">
            ×
        </button>

        <a href="index.html">Inicio</a>
        <a href="catalogo.html" class="activo">Catálogo</a>
        <a href="index.html#nosotros">Nosotros</a>
        <a href="index.html#contacto">Contacto</a>

    </nav>

    <div class="acciones">
        <button id="abrir-filtros">Buscar</button>
    </div>

</header>


    <!-- =========================
         PANEL DE BÚSQUEDA
         ========================= -->

    <div class="panel-filtros" id="panel-filtros">

        <div class="filtros-contenido">

            <div class="filtros-encabezado">

                <h2>
                    Encuentra tus armazones
                </h2>

                <button id="cerrar-filtros">
                    ×
                </button>

            </div>


            <!-- BUSCADOR -->

            <input
                type="text"
                id="buscar-modelo"
                placeholder="Buscar marca, modelo o característica..."
            >


            <div class="filtros-opciones">


                <!-- MARCA -->

                <select id="filtro-marca">

                    <option value="">
                        Todas las marcas
                    </option>

                </select>


                <!-- MATERIAL -->

                <select id="filtro-material">

                    <option value="">
                        Todos los materiales
                    </option>

                    <option value="PASTA">
                        Pasta
                    </option>

                    <option value="METALICO">
                        Metálico
                    </option>

                    <option value="TITANIO">
                        Titanio
                    </option>

                </select>


                <!-- COLOR -->

                <select id="filtro-color">

                    <option value="">
                        Todos los colores
                    </option>

                    <option value="NEGRO">Negro</option>
                    <option value="CAREY">Carey</option>
                    <option value="TRANSPARENTE">Transparente</option>
                    <option value="VINO">Vino</option>
                    <option value="ROJO">Rojo</option>
                    <option value="AZUL">Azul</option>
                    <option value="DORADO">Dorado</option>
                    <option value="GRIS">Gris</option>
                    <option value="VERDE">Verde</option>
                    <option value="MORADO">Morado</option>
                    <option value="CAFE">Café</option>
                    <option value="PLATA">Plata</option>
                    <option value="NARANJA">Naranja</option>
                    <option value="BLANCO">Blanco</option>

                </select>


                <!-- PRECIO -->

                <select id="filtro-precio">

                    <option value="">
                        Cualquier precio
                    </option>

                    <option value="500">
                        Hasta $500
                    </option>

                    <option value="800">
                        Hasta $800
                    </option>

                    <option value="1000">
                        Hasta $1,000
                    </option>

                    <option value="1500">
                        Hasta $1,500
                    </option>

                    <option value="2000">
                        Hasta $2,000
                    </option>

                </select>

            </div>

<button id="aplicar-filtros">
    Ver resultados
</button>
            <button id="limpiar-filtros">
                Limpiar filtros
            </button>

        </div>

    </div>


    <!-- =========================
         CONTENIDO PRINCIPAL
         ========================= -->

    <main>

        <!-- =========================
             CATÁLOGO
             ========================= -->

        <section
            id="catalogo"
            class="seccion-catalogo"
        >

            <div class="cabecera-catalogo">

    <div class="titulo-seccion">

        <h2>
            Nuestros armazones
        </h2>

        <p class="subtitulo">
            ENCUENTRA EL QUE VA CONTIGO
        </p>

    </div>

</div>

<div class="barra-catalogo">

    <div class="categorias-catalogo">

        <button class="categoria activa" data-categoria="TODOS">Todos</button>
        <button class="categoria" data-categoria="MUJER">Mujer</button>
        <button class="categoria" data-categoria="HOMBRE">Hombre</button>
        <button class="categoria" data-categoria="NIÑOS">Niños</button>
        <button class="categoria" data-categoria="DEPORTE">Deporte</button>
        <button class="categoria" data-categoria="INDUSTRIAL">Industrial</button>

    </div>

    <button id="abrir-filtros-catalogo">
        Filtrar
    </button>

</div>


            <!--
                JavaScript coloca aquí
                automáticamente las tarjetas.
            -->

            <div class="productos"></div>


        </section>


    </main>


    <!-- =========================
         PIE DE PÁGINA
         ========================= -->

    <footer id="contacto">

        <p>
            Óptica AQUA
        </p>

        <p>
            Encuentra tu estilo. Ve diferente.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

<<script src="script.js/inventario.js"></script>
<script src="script.js/script.js"></script>

</body>

</html>
