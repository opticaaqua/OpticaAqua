<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Óptica Aqua</title>

    <link rel="stylesheet" href="style.css/style.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">

        <div class="logo">
            <img src="imagenes/Aqua Logo.png" alt="">

        </div>

        <nav class="menu">
            <a href="#">Inicio</a>
            <a href="#catalogo">Catálogo</a>
            <a href="#nosotros">Nosotros</a>
            <a href="#contacto">Contacto</a>
        </nav>

        <div class="acciones">
            <button>Buscar</button>
        </div>

    </header>


    <!-- PORTADA -->
    <main>

        <section class="hero">

            <div class="hero-texto">

                <p class="subtitulo">
                    COLECCIÓN ÓPTICA AQUA
                </p>

                <h1>
                    Encuentra el armazón
                    que va contigo.
                </h1>

                <p>
                    Explora nuestra selección de armazones
                    y descubre tu próximo estilo.
                </p>

                <a href="#catalogo" class="boton">
                    Explorar catálogo
                </a>

            </div>

            <div class="hero-imagen">
                <img src="imagenes/OPTICA POST-03.jpg" alt="">
            </div>

        </section>


        <!-- CATÁLOGO -->
        <section id="catalogo" class="seccion-catalogo">

            <div class="titulo-seccion">

                <p class="subtitulo">
                    NUESTRA SELECCIÓN
                </p>

                <h2>
                    Armazones destacados
                </h2>

            </div>

            <div class="productos">
                <!-- Aquí generaremos los lentes -->
            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer id="contacto">

        <p>Óptica AQUA</p>
        <p>Encuentra tu estilo. Ve diferente.</p>

    </footer>


    <script src="script.js/script.js"></script>

</body>

</html>
